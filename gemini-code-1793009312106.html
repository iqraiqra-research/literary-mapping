<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithmic Poetics Dashboard | Lahore Garrison University</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lgu: {
                            green: '#005A36',
                            greenDark: '#003B23',
                            greenLight: '#007A4B',
                            gold: '#D4AF37',
                            goldLight: '#F3E5AB',
                            navy: '#001D33'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .map-container { min-height: 400px; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #005A36; border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-lgu-green text-white shadow-lg border-b-4 border-lgu-gold sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <!-- LGU Crest Logo -->
                <div class="w-12 h-12 bg-white rounded-full p-1 shadow flex items-center justify-center border-2 border-lgu-gold">
                    <img src="https://lgu.edu.pk/wp-content/uploads/2020/09/lgu-logo.png" alt="LGU Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23005A36\' stroke=\'%23D4AF37\' stroke-width=\'4\'/><text x=\'50\' y=\'58\' font-size=\'32\' font-weight=\'bold\' text-anchor=\'middle\' fill=\'%23D4AF37\'>LGU</text></svg>';">
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                        Algorithmic Poetics Dashboard
                        <span class="text-xs px-2 py-0.5 rounded-full bg-lgu-gold text-slate-900 font-semibold uppercase tracking-wider">Lab Suite</span>
                    </h1>
                    <p class="text-xs text-lgu-goldLight font-medium">
                        Lahore Garrison University &bull; Based on <em>Literary Mapping in the Digital Age</em> &bull; <span class="text-lgu-gold font-bold">Made by Iqra Iqbal</span>
                    </p>
                </div>
            </div>

            <!-- Global Action Bar -->
            <div class="flex items-center space-x-3">
